name: judge-ci

on:
  push:
  pull_request:

jobs:
  judge-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install benchmark dependencies
        run: npm --prefix bench ci

      - name: Replay judge evidence
        run: npm run ci:judge

      - name: Raw model frontier gate
        continue-on-error: true
        run: npm run frontier-gate:raw

      - name: Upload judge artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-evidence
          path: |
            bench/results/demo-recordings/
            optimizer/results/*.json
          if-no-files-found: warn
